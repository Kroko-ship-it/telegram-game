<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Инвестиционная Игра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #181a20;
            --accent-green: #22c55e;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .header {
            padding: 15px 20px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            border-bottom: 1px solid #222;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            padding-bottom: 90px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Стиль карточек как на скриншоте */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .input-group {
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #0f1015;
            border: 1px solid #2d313e;
            border-radius: 12px;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-green {
            width: 100%;
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }

        /* Нижнее меню */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background-color: #121318;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            font-size: 11px;
            text-decoration: none;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active {
            color: #eab308; /* Желтый подсвеченный цвет */
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="header">Крупнейшая Инвестиционная Компания</div>

    <div class="content">
        <!-- Экран "Люди" -->
        <div id="tab-people" class="tab-content active">
            <h2>Люди</h2>
            <p style="color: var(--text-sub); font-size: 14px;">Кто с тобой играет</p>

            <div class="card">
                <h3>Добавить друга</h3>
                <div class="input-group">
                    <input type="text" placeholder="@username">
                </div>
                <button class="btn-green" onclick="addFriend()">Добавить</button>
            </div>
        </div>

        <!-- Экран "Счёт" -->
        <div id="tab-account" class="tab-content">
            <h2>Ваш Счёт</h2>
            <div class="card">
                <h1 style="color: var(--accent-green); margin: 0;">$12,450.00</h1>
                <p style="color: var(--text-sub);">Баланс активов</p>
            </div>
        </div>

        <!-- Экран "Рынок" -->
        <div id="tab-market" class="tab-content">
            <h2>Рынок акций</h2>
            <div class="card">
                <p>📈 Apple (+2.4%)</p>
                <p>📉 Bitcoin (-0.8%)</p>
            </div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="nav-bar">
        <div class="nav-item" onclick="switchTab('account', this)">
            <div class="nav-icon">💼</div>
            <div>Счёт</div>
        </div>
        <div class="nav-item" onclick="switchTab('market', this)">
            <div class="nav-icon">📊</div>
            <div>Рынок</div>
        </div>
        <div class="nav-item active" onclick="switchTab('people', this)">
            <div class="nav-icon">👥</div>
            <div>Люди</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран Telegram

        function switchTab(tabName, element) {
            // Переключение вкладок
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');

            if (tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        }

        function addFriend() {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
            alert('Заявка отправлена!');
        }
    </script>
</body>
</html>
