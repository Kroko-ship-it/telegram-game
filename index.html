<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #2a2a2a);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            text-align: center;
            width: 80%;
            max-width: 300px;
        }
        h1 {
            font-size: 42px;
            margin: 10px 0;
            color: #0088cc;
        }
        .btn {
            background: linear-gradient(135deg, #0088cc, #005588);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s;
            width: 100%;
            margin-top: 15px;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🪙 Монеты</h2>
    <h1 id="score">0</h1>
    <button class="btn" onclick="clickCoin()">КЛИК!</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let score = 0;

    function clickCoin() {
        score++;
        document.getElementById('score').innerText = score;
        
        if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('medium');
        }
    }
</script>

</body>
</html>
